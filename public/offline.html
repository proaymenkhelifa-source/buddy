<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy – Pas de connexion</title>
  <link rel="icon" type="image/svg+xml" href="/icons/buddy-bubble.svg">
  <!-- Page affichée quand l'appli s'ouvre sans Internet (gardée en mémoire par sw.js) -->
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #14284b; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0d1b33; color: #f1f5f9; } p { color: #94a3b8 !important; } }
    main { max-width: 360px; display: grid; gap: 14px; justify-items: center; }
    img.buddy { height: 170px; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 900; }
    p { margin: 0; color: #64748b; line-height: 1.5; }
    button { margin-top: 6px; padding: 13px 26px; border: none; border-radius: 99px; background: #5fe2c3; color: #14284b; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img class="buddy" src="/buddy/relax.webp" alt="">
    <h1 id="title">Pas de connexion</h1>
    <p id="text">Buddy a besoin d'Internet pour te coacher. Vérifie ta connexion, et on reprend où on en était.</p>
    <button id="retry" onclick="location.reload()">Réessayer</button>
  </main>
  <script>
    if (!/^fr/i.test(navigator.language || "")) {
      document.documentElement.lang = "en";
      document.getElementById("title").textContent = "No connection";
      document.getElementById("text").textContent = "Buddy needs the internet to coach you. Check your connection and we'll pick up where we left off.";
      document.getElementById("retry").textContent = "Try again";
    }
    // Dès qu'Internet revient, on recharge tout seul
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
